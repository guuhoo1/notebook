server {
    listen 5137;
    server_name 39.106.214.192;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/code/frontend;

    include /www/server/panel/vhost/nginx/extension/39.106.214.192/*.conf;
    include /www/server/panel/vhost/nginx/well-known/39.106.214.192.conf;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API 代理到后端
    location /api/ {
        proxy_pass http://xxxxxxx/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # 上传文件静态服务 - 关键配置！
    location /uploads/ {
        alias /www/wwwroot/code/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # 确保图片文件可以被访问
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
        }
    }

    # 前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全配置
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    access_log /www/wwwlogs/39.106.214.192.log;
    error_log /www/wwwlogs/39.106.214.192.error.log;
}
